name: pages

# Publishes the apps to Cloudflare Pages (https://porta-pages.pages.dev/). A merge to main that changes one
# deploys to production; a pull request that changes one gets a preview deployment with its own URL, linked from
# the pull request and the job summary.
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - '*.html'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

# One deploy per branch at a time. A new push to a pull request cancels its preview that is still going, but a
# production deploy that has started runs to the end instead of being cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    # Pull requests from forks and from Dependabot aren't given the Cloudflare secrets, so they get no preview.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write # lets wrangler-action record a GitHub deployment with the site's URL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The site is the apps and nothing else: no README, tools/ or workflow files.
      - run: mkdir _site && cp *.html _site/
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned, because the action otherwise installs the latest Wrangler 4.x on every run. Dependabot doesn't
          # update this, so bump it by hand.
          wranglerVersion: '4.141.0'
          # A pull request's checkout is a detached merge commit, so name the branch rather than let Wrangler guess.
          # main is the project's production branch; any other branch is a preview.
          command: pages deploy _site --project-name=porta-pages --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
