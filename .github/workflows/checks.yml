name: checks

# Pull requests only, and only when they change something the checks look at. A merge to main runs nothing,
# because the pull request's run already checked it.
on:
  pull_request:
    paths:
      - '*.html'
      - 'tools/**'
      - '.github/workflows/checks.yml'

# A new push to a pull request cancels its run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Use a version the runner image already has, so it isn't downloaded on every run. Both ubuntu-24.04
          # and ubuntu-26.04 have 22 and 24. Check again when ubuntu-latest moves to a new image.
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      # Download the browsers while apt installs their system libraries, instead of one after the other.
      # Headless Chromium runs on the headless shell, so the full Chrome build isn't needed.
      - run: |
          npx playwright install --only-shell chromium firefox webkit &
          npx playwright install-deps chromium firefox webkit
          wait $!
      - run: npm test
