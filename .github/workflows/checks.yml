name: checks

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its run that is still going. Pushes to main get a group of their own
# (head_ref is empty for them), so every one of them runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      # Headless Chromium runs on the headless shell, so the full Chrome build isn't needed.
      - run: npx playwright install --with-deps --only-shell chromium firefox webkit
      - run: npm test
