<!DOCTYPE html>
<!--
  Emergency binder

  The information someone would need if you were hurt, sick or missing:
  medical details, emergency contacts, doctors, insurance numbers, notes,
  and small attached documents such as a photo of an insurance card. It
  works offline, from a file on your phone or computer, which is exactly
  when you need it.

  The file is the database. Press Edit to fill it in, then Save. Save
  writes a new copy of this page with your information inside it, so keep
  that copy and open it from now on. In Chrome and Edge, Save lets you pick
  a file and later saves go straight to it. In other browsers each save is
  a download, and downloads pile up as "emergency-binder (3).html" and so
  on: the revision number and date at the bottom of the page tell copies
  apart. Delete the old ones.

  Until you save, your edits are kept in this browser (localStorage), so a
  closed tab doesn't lose them. Print gives a paper copy of the same page.

  Attached documents are limited to 3 MB in all, and large photos are
  shrunk when you add them. Import reads the information out of another
  binder file, for example to move it into a newer version of this page.

  Nothing is encrypted. Anyone who has the file can read it, which is the
  point in an emergency, so store and share it the way you would a paper
  binder.

  Open this file with #test at the end of the URL to run the built-in
  self-test and show the results on the page.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">

<meta name="description" content="Medical information, emergency contacts and insurance numbers in one file that saves itself and works offline.">
<style>
  :root {

    --ok-bg: #1e3a2d; --ok: #7fd1a5; --warn-bg: #3f3215; --warn: #f0c46c;

  .vitals { margin: 0 0 0.75rem; color: var(--ink-2); }
  .vitals b { color: var(--ink); }
  .alert { background: var(--alert-bg); color: var(--alert); border-radius: 8px; padding: 0.5rem 0.75rem; margin: 0.5rem 0; }
  .alert strong { display: block; font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
  dl { margin: 0; display: grid; grid-template-columns: minmax(8rem, max-content) 1fr; gap: 0.375rem 1rem; }
  dt { color: var(--ink-2); font-size: 0.9375rem; }
  dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  @media (max-width: 30rem) { dl { grid-template-columns: 1fr; gap: 0; } dd { margin-bottom: 0.5rem; } }
  .people { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr)); }

  .person .who { font-weight: 600; }

  .person .phone { font-size: 1.125rem; font-weight: 600; }
  .person p { margin: 0; }
  .docs { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); }
  .doc { margin: 0; }
  .doc button.thumb { display: block; width: 100%; padding: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); cursor: zoom-in; overflow: hidden; }
  .doc img { display: block; width: 100%; height: 8rem; object-fit: cover; }
  .doc figcaption { font-size: 0.875rem; margin-top: 0.25rem; overflow-wrap: anywhere; }
  .file-chip { display: flex; align-items: center; justify-content: center; height: 8rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); font-weight: 700; color: var(--ink-2); }
  .empty { text-align: center; padding: 2rem 1rem; }

  .colophon { margin-top: 1.5rem; font-size: 0.8125rem; color: var(--ink-2); text-align: center; }

  form.editor fieldset { min-width: 0; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); margin: 0 0 1rem; padding: 0.75rem 1.125rem 1rem; }
  form.editor legend { font-weight: 700; font-size: 1.0625rem; padding: 0 0.25rem; }

  dialog img { display: block; max-width: 100%; max-height: calc(94vh - 4rem); margin: 0 auto; }

  #test-report.pass { background: var(--pass-bg); color: var(--pass); }
  #test-report.fail { background: var(--fail-bg); color: var(--fail); }

  @media print {
    :root { --paper: #fff; --panel: #fff; --ink: #000; --ink-2: #333; --rule: #999; --accent: #000; --alert-bg: #fff; --alert: #000; }

    .doc img { height: auto; max-height: 4in; object-fit: contain; }

</style>

<body>
<header class="bar">
  <div class="bar-inner">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" fill="#b3261e"/><path d="M10.5 5h5v5.5H21v5h-5.5V21h-5v-5.5H5v-5h5.5z" fill="#fff"/></svg>
      <span>Emergency binder</span>
    </div>
    <div class="tools">
      <button type="button" class="btn" id="edit-btn">Edit</button>
      <button type="button" class="btn primary" id="save-btn">Save</button>
      <button type="button" class="btn" id="print-btn">Print</button>
      <details class="more" id="more">
        <summary class="btn" aria-label="More actions">More</summary>
        <div class="more-menu">
          <button type="button" class="btn" id="download-btn">Download a copy</button>
          <button type="button" class="btn" id="import-btn">Import from a binder file…</button>
          <button type="button" class="btn" id="example-btn">Fill in an example</button>
          <button type="button" class="btn danger" id="erase-btn">Erase everything</button>
        </div>
      </details>
      <input type="file" id="import-file" accept=".html,.htm,.json,text/html,application/json" hidden>
    </div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</header>
<main>
  <div id="banners"></div>
  <div id="view"></div>
  <form id="edit" class="editor" hidden></form>
</main>
<dialog id="viewer">
  <div class="dialog-bar"><span id="viewer-name"></span><button type="button" class="btn small" id="viewer-close">Close</button></div>
  <img id="viewer-img" alt="">
</dialog>
<script type="application/json" id="binder-data">null</script>
<script>
'use strict';

/* ===================== THE FILE AS A TEMPLATE ===================== */
// Copy the page as it came out of the file, before anything renders into it. Saving fills this copy with
// the binder's data and writes it out, so the saved file is this same app with the data inside.
const TEMPLATE = document.documentElement.cloneNode(true);
const PROLOGUE = Array.prototype.filter.call(document.childNodes, (n) => n.nodeType === Node.COMMENT_NODE)
  .map((n) => '<\!--' + n.data + '-->\n').join('');

const FORMAT = 1;
const DOC_BUDGET = 3 * 1024 * 1024;  // bytes of attached documents, decoded
const SHRINK_OVER = 400 * 1024;      // photos bigger than this are scaled down...
const SHRINK_SIDE = 1600;            // ...to at most this many pixels on the long side
const DRAFT_KEY = 'emergency-binder:draft:' + location.pathname;  // file:// pages can share one localStorage

/* ===================== WHAT A BINDER HOLDS ===================== */
// [key, label, kind]. kind: text (default), area, date, tel, email, blood.
const SINGLE = {
  about: { title: 'About me', fields: [
    ['name', 'Full name'], ['dob', 'Date of birth', 'date'], ['bloodType', 'Blood type', 'blood'],
    ['languages', 'Languages spoken'], ['address', 'Home address', 'area'],
    ['other', 'Other identifying details', 'area'],
  ] },
  medical: { title: 'Medical', fields: [
    ['allergies', 'Allergies', 'area'], ['conditions', 'Medical conditions', 'area'],
    ['medications', 'Medications and doses', 'area'], ['devices', 'Implants and devices', 'area'],
    ['directive', 'Advance directive or DNR', 'area'],
  ] },
};
const LISTS = {
  contacts: { title: 'Emergency contacts', noun: 'contact', hint: 'The first one is shown at the top as the person to call first.', fields: [
    ['name', 'Name'], ['relation', 'Relationship'], ['phone', 'Phone', 'tel'], ['email', 'Email', 'email'], ['notes', 'Notes', 'area'],
  ] },
  doctors: { title: 'Doctors and pharmacy', noun: 'doctor or pharmacy', fields: [
    ['name', 'Name'], ['role', 'Specialty or role'], ['phone', 'Phone', 'tel'], ['notes', 'Address and notes', 'area'],
  ] },
  insurance: { title: 'Insurance', noun: 'policy', fields: [
    ['kind', 'Type (health, dental, auto, home…)'], ['provider', 'Provider'], ['member', 'Member or policy number'],
    ['group', 'Group number'], ['phone', 'Phone', 'tel'], ['notes', 'Notes', 'area'],
  ] },
};
const BLOOD_TYPES = ['A+', 'A−', 'B+', 'B−', 'AB+', 'AB−', 'O+', 'O−', 'Unknown'];

function blankBinder() {
  const b = { about: {}, medical: {}, contacts: [], doctors: [], insurance: [], notes: '', documents: [] };
  for (const s in SINGLE) for (const [k] of SINGLE[s].fields) b[s][k] = '';
  return b;
}
function blankItem(list) {
  const o = {};
  for (const [k] of LISTS[list].fields) o[k] = '';
  return o;
}
function str(v) { return typeof v === 'string' ? v : (typeof v === 'number' ? String(v) : ''); }

const DATA_URL = /^data:[a-z0-9.+-]+\/[a-z0-9.+-]+(;[a-z0-9.+=-]+)*;base64,[a-z0-9+/]*={0,2}$/i;

// Anything read from a file or from storage goes through here, so the rest of the app can trust its shape.
function normalize(raw) {
  const r = raw && typeof raw === 'object' ? raw : {};
  const b = blankBinder();
  for (const s in SINGLE) {
    const src = r[s] && typeof r[s] === 'object' ? r[s] : {};
    for (const [k] of SINGLE[s].fields) b[s][k] = str(src[k]);
  }
  for (const l in LISTS) {
    const src = Array.isArray(r[l]) ? r[l] : [];
    b[l] = src.filter((it) => it && typeof it === 'object').map((it) => {
      const o = blankItem(l);
      for (const k in o) o[k] = str(it[k]);
      return o;
    });
  }
  b.notes = str(r.notes);
  b.documents = (Array.isArray(r.documents) ? r.documents : [])
    .filter((d) => d && typeof d.dataUrl === 'string' && DATA_URL.test(d.dataUrl))
    .map((d) => ({
      name: str(d.name) || 'Untitled',
      type: d.dataUrl.slice(5, d.dataUrl.search(/[;,]/)).toLowerCase(),
      added: str(d.added),
      dataUrl: d.dataUrl,
    }));
  return b;
}

// The payload is what's embedded in the file: the binder plus which save it came from.
function readPayload(obj) {
  if (obj === null || obj === undefined) return { revision: 0, savedAt: null, binder: blankBinder() };
  if (typeof obj !== 'object') throw new Error('the binder data is not an object');
  if (obj.format > FORMAT) throw new Error('it was saved by a newer version of this page');
  const rev = Number.isInteger(obj.revision) && obj.revision >= 0 ? obj.revision : 0;
  return { revision: rev, savedAt: typeof obj.savedAt === 'string' ? obj.savedAt : null, binder: normalize(obj.binder) };
}

function isBlankItem(o) { return Object.keys(o).every((k) => o[k].trim() === ''); }
function isEmpty(b) {
  for (const s in SINGLE) if (!isBlankItem(b[s])) return false;
  for (const l in LISTS) if (b[l].some((it) => !isBlankItem(it))) return false;
  return b.notes.trim() === '' && b.documents.length === 0;
}

/* ===================== SAVING ===================== */
// JSON inside a script element ends at the first "</" + "script", and an HTML comment opener changes how the
// parser reads it, so every "<" is written as \u003c. JSON.parse reads it back as "<".
function embedJson(payload) {
  return JSON.stringify(payload).replace(/</g, '\\u003c');
}

function buildHtml(payload) {
  const copy = TEMPLATE.cloneNode(true);
  copy.querySelector('#binder-data').textContent = embedJson(payload);
  const name = payload.binder.about.name.trim();
  copy.querySelector('title').textContent = name ? name + ' · Emergency binder' : 'Emergency binder';
  // A readable copy for wherever scripts don't run (some file previewers, mail apps). The script redraws it.
  const footer = 'Revision ' + payload.revision + ', saved ' + formatDate(payload.savedAt, true) + '.';
  copy.querySelector('#view').replaceChildren(renderView(payload.binder, footer, new Date(payload.savedAt), true));
  return '<!DOCTYPE html>\n' + PROLOGUE + copy.outerHTML + '\n';
}

function suggestName(b, savedAt) {
  const slug = b.about.name.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  const day = savedAt.slice(0, 10);
  return 'emergency-binder-' + (slug ? slug + '-' : '') + day + '.html';
}

function downloadText(text, filename, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.hidden = true;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ===================== DRAFTS IN THIS BROWSER ===================== */
function version(p) { return p ? { revision: p.revision, savedAt: p.savedAt } : null; }
function sameVersion(a, b) { return !!a && !!b && a.revision === b.revision && a.savedAt === b.savedAt; }

// A draft is kept whenever the binder differs from what's in the open file, even after a download: the
// download may have gone wrong, and the open file still holds the old data until it's replaced.
function makeDraft(st) {
  if (JSON.stringify(st.binder) === JSON.stringify(st.file.binder)) return null;
  return {
    file: version(st.file),
    saved: st.saved.revision !== st.file.revision || st.saved.savedAt !== st.file.savedAt
      ? { revision: st.saved.revision, savedAt: st.saved.savedAt, filename: st.saved.filename, how: st.saved.how } : null,
    clean: !isDirty(st),
    at: new Date().toISOString(),
    binder: st.binder,
  };
}
function writeDraft(store, key, st) {
  try {
    const d = makeDraft(st);
    if (d) store.setItem(key, JSON.stringify(d)); else store.removeItem(key);
    return true;
  } catch (e) { return false; }  // full (big attachments) or not allowed (private mode)
}
function readDraft(store, key) {
  try {
    const d = JSON.parse(store.getItem(key));
    return d && typeof d === 'object' && d.binder && d.file ? d : null;
  } catch (e) { return null; }
}

// What to do with a draft found when the page opens.
//  restore:  it was made on this very file.
//  drop:     this file is the copy it was saved to, and nothing changed since.
//  resume:   this file is the copy it was saved to, and there were more edits after.
//  conflict: it belongs to some other version of the file; ask.
function resolveDraft(file, d) {
  if (!d) return 'none';
  if (sameVersion(d.file, file)) return 'restore';
  if (sameVersion(d.saved, file)) return d.clean ? 'drop' : 'resume';
  return 'conflict';
}

/* ===================== STATE ===================== */
const S = {
  file: null,       // the payload embedded in the open file
  binder: null,     // the binder being shown and edited
  saved: null,      // the last save: { revision, savedAt, json, filename, how }
  minRevision: 0,   // an import can carry a higher revision; the next save goes past it
  editing: false,
  handle: null,     // File System Access handle, where supported
  draftOk: true,
  loadError: null,
  conflict: null,
};
function isDirty(st) { return JSON.stringify(st.binder) !== st.saved.json; }

function load() {
  try {
    S.file = readPayload(JSON.parse(document.getElementById('binder-data').textContent));
  } catch (e) {
    S.loadError = e.message;
    S.file = readPayload(null);

    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);

}

    if (!el) throw new Error('That file isn’t an emergency binder.');
    obj = JSON.parse(el.textContent);
  }
  if (obj && typeof obj === 'object' && !('binder' in obj)) obj = { format: FORMAT, binder: obj };  // a bare binder
  const p = readPayload(obj);

  S.minRevision = Math.max(S.minRevision, p.revision);

    const d = S.conflict;
    box.append(h('div', { class: 'banner' },
      h('p', { text: 'This browser has unsaved changes to a binder at this address from ' + formatDate(d.at, true) + '. They were made to ' + (d.file.revision ? 'revision ' + d.file.revision : 'an unsaved binder') + ', and this file is ' + (S.file.revision ? 'revision ' + S.file.revision : 'empty') + '.' }),
      h('p', null,
        h('button', { type: 'button', class: 'btn', text: 'Use those changes', onclick: () => { S.binder = normalize(d.binder); S.conflict = null; renderAll(); changed(); } }), ' ',
        h('button', { type: 'button', class: 'btn', text: 'Discard them', onclick: () => { S.conflict = null; flushDraft(); renderAll(); } }))));
  }
}

function wire() {
  const edit = document.getElementById('edit');
  edit.addEventListener('submit', (e) => e.preventDefault());
  edit.addEventListener('input', (e) => {
    const path = e.target.getAttribute('data-path');
    if (!path) return;
    setPath(S.binder, path, e.target.value);
    changed();
  });
  edit.addEventListener('change', (e) => {
    if (e.target.id === 'doc-file' && e.target.files.length) addDocuments(Array.from(e.target.files));
  });
  edit.addEventListener('click', (e) => {
    const add = e.target.getAttribute('data-add'), rem = e.target.getAttribute('data-remove');
    if (add) {
      S.binder[add].push(blankItem(add));
      renderAll(); changed();
      const items = edit.querySelectorAll('[data-path^="' + add + '.' + (S.binder[add].length - 1) + '."]');
      if (items[0]) items[0].focus();
    } else if (rem) {
      const [list, i] = rem.split('.');
      S.binder[list].splice(+i, 1);
      renderAll(); changed();
    }
  });
  document.getElementById('edit-btn').addEventListener('click', () => setEditing(!S.editing));
  document.getElementById('save-btn').addEventListener('click', () => save(false));
  document.getElementById('print-btn').addEventListener('click', () => window.print());
  const more = document.getElementById('more');
  const closeMore = () => { more.open = false; };
  document.getElementById('download-btn').addEventListener('click', () => { closeMore(); save(true); });
  document.getElementById('import-btn').addEventListener('click', () => { closeMore(); document.getElementById('import-file').click(); });
  document.getElementById('import-file').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importFile(f); });
  document.getElementById('example-btn').addEventListener('click', () => { closeMore(); fillExample(); });
  document.getElementById('erase-btn').addEventListener('click', () => {
    closeMore();
    if (isEmpty(S.binder) || !confirm('Erase everything in this binder? The file keeps the old information until you save.')) return;
    S.binder = blankBinder();
    renderAll(); changed();
  });
  document.addEventListener('click', (e) => { if (more.open && !more.contains(e.target)) closeMore(); });
  document.getElementById('viewer-close').addEventListener('click', () => document.getElementById('viewer').close());
  window.addEventListener('beforeprint', renderView0);
  window.addEventListener('pagehide', flushDraft);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushDraft(); });
  window.addEventListener('beforeunload', (e) => { if (isDirty(S)) { flushDraft(); e.preventDefault(); e.returnValue = ''; } });
}

/* ===================== SELF TEST (runs only with #test) ===================== */
function selfTest() {
  const fails = [];
  let n = 0;
  function ok(cond, name, detail) { n++; if (!cond) fails.push(name + (detail !== undefined ? ' — got ' + detail : '')); }
  function memStore(full) {
    const m = new Map();
    return {
      getItem: (k) => (m.has(k) ? m.get(k) : null),
      setItem: (k, v) => { if (full) throw new DOMException('full', 'QuotaExceededError'); m.set(k, String(v)); },
      removeItem: (k) => m.delete(k), size: () => m.size,
    };
  }
  try {
    const ex = exampleBinder();
    const tricky = structuredClone(ex);
    tricky.notes = 'Ends <\/script><\script>alert(1)<\/script> and <\!-- a comment, and \u2028 too';
    tricky.documents = [{ name: 'card.png', type: 'image/png', added: '', dataUrl: 'data:image/png;base64,iVBORw0KGgo=' }];

    // embedding
    const emb = embedJson({ format: 1, binder: tricky });
    ok(!emb.includes('<'), 'embedded JSON has no "<" left in it');
    ok(JSON.parse(emb).binder.notes === tricky.notes, 'embedded JSON reads back unchanged');

    // the saved file
    const payload = { format: FORMAT, revision: 7, savedAt: '2026-11-24T15:00:00.000Z', binder: tricky };
    const html = buildHtml(payload);
    ok(html.startsWith('<!DOCTYPE html>\n<\!--\n  Emergency binder'), 'saved file starts with the doctype and header comment');
    ok(html.endsWith('</html>\n'), 'saved file ends with </html> and a newline');
    ok(!html.includes('\r'), 'saved file has LF line endings');
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const csp = doc.querySelector('meta[http-equiv="Content-Security-Policy"]');
    ok(csp && csp.content.includes("default-src 'none'"), 'saved file keeps the Content-Security-Policy');
    ok(doc.querySelectorAll('#binder-data').length === 1, 'saved file has exactly one data block', doc.querySelectorAll('#binder-data').length);
    ok(doc.querySelectorAll('script').length === 2, 'the data cannot open a script element of its own', doc.querySelectorAll('script').length);
    const back = readPayload(JSON.parse(doc.getElementById('binder-data').textContent));
    ok(back.revision === 7 && back.savedAt === payload.savedAt, 'saved file keeps revision and date');
    ok(JSON.stringify(back.binder) === JSON.stringify(normalize(tricky)), 'saved file round-trips the binder');
    ok(doc.querySelector('#view .ice h2') && doc.querySelector('#view .ice h2').textContent === 'Alex Rivera', 'saved file is readable without scripts');
    ok(!doc.querySelector('#view img, #view button') && doc.getElementById('edit').children.length === 0, 'the readable copy has no images, buttons or editor');
    ok(!doc.getElementById('test-report'), 'saved file has no test report');
    ok(doc.title === 'Alex Rivera · Emergency binder', 'saved file is titled with the name', doc.title);
    ok(JSON.stringify(extractPayload(html).binder) === JSON.stringify(normalize(tricky)), 'import reads a saved file back');
    ok(extractPayload(JSON.stringify(ex)).binder.about.name === 'Alex Rivera', 'import reads a bare JSON binder');
    let threw = false;
    try { extractPayload('<!DOCTYPE html><p>hello</p>'); } catch (e) { threw = true; }
    ok(threw, 'import refuses a page that is not a binder');
    threw = false;
    try { readPayload({ format: FORMAT + 1, binder: {} }); } catch (e) { threw = true; }
    ok(threw, 'a binder from a newer format is refused, not misread');

    // reading untrusted data
    const blank = readPayload(null);
    ok(blank.revision === 0 && isEmpty(blank.binder), 'an empty file opens as a blank binder');
    const odd = normalize({ about: { name: 42, dob: { x: 1 } }, contacts: [null, 'x', { name: 'A', phone: 5, extra: 'drop me' }],
      documents: [{ name: 'evil', dataUrl: 'javascript:alert(1)' }, { name: 'ok.png', dataUrl: 'data:image/png;base64,iVBORw0KGgo=' }, { dataUrl: 'data:text/html,<\script>' }] });
    ok(odd.about.name === '42' && odd.about.dob === '', 'non-string fields are coerced or dropped');
    ok(odd.contacts.length === 1 && odd.contacts[0].phone === '5' && !('extra' in odd.contacts[0]), 'bad list items and unknown keys are dropped');
    ok(odd.documents.length === 1 && odd.documents[0].type === 'image/png', 'only base64 data: URLs are kept as documents', odd.documents.length);
    ok(isEmpty(normalize({ contacts: [{ name: '  ' }] })), 'a binder with only blank entries counts as empty');

    // drafts
    const st = (fileRev, savedRev, binder, savedJson) => ({
      file: { revision: fileRev, savedAt: 'f' + fileRev, binder: ex },
      saved: { revision: savedRev, savedAt: 'f' + savedRev, json: savedJson, filename: 'x.html' },
      binder,
    });
    const store = memStore(false);
    ok(writeDraft(store, 'k', st(1, 1, ex, JSON.stringify(ex))) && store.size() === 0, 'no draft is kept when nothing changed');
    const edited = structuredClone(ex); edited.notes = 'changed';
    ok(writeDraft(store, 'k', st(1, 1, edited, JSON.stringify(ex))) && store.size() === 1, 'a draft is kept after an edit');
    const d1 = readDraft(store, 'k');
    ok(d1 && d1.binder.notes === 'changed' && d1.clean === false && d1.saved === null, 'the draft holds the edit and is marked unsaved');
    ok(resolveDraft({ revision: 1, savedAt: 'f1' }, d1) === 'restore', 'a draft made on this file is restored');
    ok(resolveDraft({ revision: 2, savedAt: 'f2' }, d1) === 'conflict', 'a draft made on another version asks first');
    writeDraft(store, 'k', st(1, 2, edited, JSON.stringify(edited)));
    const d2 = readDraft(store, 'k');
    ok(d2 && d2.clean === true && d2.saved && d2.saved.revision === 2, 'after a download the draft remembers the new revision');
    ok(resolveDraft({ revision: 2, savedAt: 'f2' }, d2) === 'drop', 'opening the saved copy drops a clean draft');
    ok(resolveDraft({ revision: 2, savedAt: 'f2' }, Object.assign({}, d2, { clean: false })) === 'resume', 'opening the saved copy keeps later edits');
    ok(resolveDraft({ revision: 1, savedAt: 'f1' }, d2) === 'restore', 'reopening the old file still shows the downloaded edits');
    ok(resolveDraft({ revision: 1, savedAt: 'f1' }, null) === 'none', 'no draft, nothing to do');
    ok(writeDraft(memStore(true), 'k', st(1, 1, edited, JSON.stringify(ex))) === false, 'a full storage is reported, not thrown');
    store.setItem('k', '{not json');
    ok(readDraft(store, 'k') === null, 'an unreadable draft is ignored');

    // formatting
    ok(suggestName(normalize({ about: { name: 'José O’Neil' } }), '2026-11-24T15:00:00Z') === 'emergency-binder-jose-o-neil-2026-11-24.html', 'file name from the person’s name and date', suggestName(normalize({ about: { name: 'José O’Neil' } }), '2026-11-24T15:00:00Z'));
    ok(suggestName(blankBinder(), '2026-11-24T15:00:00Z') === 'emergency-binder-2026-11-24.html', 'file name without a name');
    ok(telHref('(555) 010-0142') === 'tel:5550100142', 'phone numbers become tel: links');
    ok(telHref('+44 20 7946 0000') === 'tel:+442079460000', 'tel: links keep + and digits');
    ok(telHref('ask at desk') === null, 'text without a number is not linked');
    ok(ageOn('1984-03-09', new Date(2026, 2, 8)) === 41 && ageOn('1984-03-09', new Date(2026, 2, 9)) === 42, 'age turns over on the birthday');
    ok(ageOn('soon', new Date()) === null, 'no age for an unreadable date');
    const tiny = { dataUrl: 'data:text/plain;base64,aGVsbG8=' };
    ok(docBytes(tiny) === 5 && dataUrlToBlob(tiny.dataUrl).size === 5, 'document size is the decoded size');
    ok(formatBytes(3 * 1024 * 1024) === '3.0 MB' && formatBytes(2048) === '2 KB', 'byte sizes are readable');

    // rendering
    const view = renderView(ex, 'footer', new Date(2026, 10, 24));
    ok(view.querySelector('.ice h2').textContent === 'Alex Rivera', 'the emergency card shows the name');
    ok(view.querySelector('.alert') && view.querySelector('.alert').textContent.includes('Penicillin'), 'allergies are shown as an alert');
    ok(view.querySelector('a[href="tel:5550100142"]'), 'the first contact is shown with a phone link');
    ok(view.querySelectorAll('.card').length === 7, 'the example fills seven cards', view.querySelectorAll('.card').length);
    ok(view.querySelectorAll('dt').length === 6 && view.querySelector('dd').textContent.includes('diabetes'), 'medical and address details are listed', view.querySelectorAll('dt').length);
    ok(renderView(blankBinder(), 'f', new Date()).querySelector('.empty'), 'an empty binder shows how to start');
    const hostile = normalize({ about: { name: '<img src=x onerror=alert(1)>' } });
    ok(!renderView(hostile, 'f', new Date()).querySelector('.ice img'), 'names are shown as text, not markup');
    const ed = h('div', null, renderEditor(ex));
    ok(ed.querySelector('#f-about-name').value === 'Alex Rivera', 'the editor is filled in');
    ok(ed.querySelectorAll('[data-path^="contacts."][data-path$=".name"]').length === 2, 'the editor has a row per contact');
    ok(new Set(Array.from(ed.querySelectorAll('[id]'), (e) => e.id)).size === ed.querySelectorAll('[id]').length, 'editor ids are unique');
    const sp = structuredClone(ex); setPath(sp, 'contacts.1.phone', '911');
    ok(sp.contacts[1].phone === '911', 'edits land in the right place');
  } catch (e) { fails.push('exception during self-test: ' + (e && e.stack || e)); }
  if (fails.length) { console.error('[emergency-binder] self-test: ' + fails.length + ' of ' + n + ' checks FAILED'); fails.forEach((f) => console.error('  ✗ ' + f)); }
  else console.info('[emergency-binder] self-test: all ' + n + ' checks passed');
  return { total: n, failures: fails };
}

// Test contract shared with tools/: set window.portaTestResult before load, then show the result on the page.
function runTestsIfRequested() {
  if (location.hash !== '#test') return;
  const r = window.portaTestResult = selfTest();
  let el = document.getElementById('test-report');
  if (!el) { el = document.createElement('div'); el.id = 'test-report'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.className = r.failures.length ? 'fail' : 'pass';
  el.textContent = r.failures.length
    ? 'Self-test: ' + r.failures.length + ' of ' + r.total + ' checks FAILED\n' + r.failures.map((f) => '✗ ' + f).join('\n')
    : 'Self-test: all ' + r.total + ' checks passed';
}

load();
wire();
renderAll();
runTestsIfRequested();
window.addEventListener('hashchange', runTestsIfRequested);
</script>
